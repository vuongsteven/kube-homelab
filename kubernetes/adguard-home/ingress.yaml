apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adguard-home
  namespace: adguard-home
spec:
  ingressClassName: traefik    # which controller should follow these rules
  rules:
    - host: adguard.home.arpa   # match requests for this name
      http:
        paths:
          - path: /            # match every URL under this name
            pathType: Prefix
            backend:
              service:
                name: adguard-home-web  # send to this Service
                port:
                  number: 80       # the Service's port, not the container's
