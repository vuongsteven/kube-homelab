apiVersion: v1                 # PVCs are in the core API, so there's no group
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
  namespace: uptime-kuma
spec:
  storageClassName: local-path # use a folder on the node's disk
  accessModes:
    - ReadWriteOnce            # can be mounted read-write by one node at a time
  resources:
    requests:
      storage: 1Gi             # local-path doesn't enforce this as a limit
