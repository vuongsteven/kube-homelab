apiVersion: v1
kind: Service
metadata:
  name: adguard-home-web       # this also becomes its DNS name
  namespace: adguard-home
spec:
  type: ClusterIP         # internal only
  selector:
    app: adguard-home      # send traffic to Pods with this label
  ports:
    - port: 80            # the port clients connect to on the Service
      targetPort: 80    # the port the container listens on
